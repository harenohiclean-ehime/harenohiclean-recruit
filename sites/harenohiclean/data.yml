flow:
  - 応募（フォーム）
  - Zoom面談
  - 業務委託契約
  - オンライン研修
  - 同行研修
  - 独り立ち

training:
  online: オンライン研修（動画）
  ride_along: 各エリアのグループの先輩スタッフに同行する研修（5日間・約12〜16件）
  source: 本人確定
  confirmed_date: 2026-11-09
  fee: 別途必要です（金額はお問い合わせください）

future:
  - 経験を積んだ先には、自分の店を持つ道もあります（グループの独立支援の仕組み。利用は任意です）
  - 独立にかかる費用は、希望する方に面談で書面でご案内します

faq:
  - q: 未経験でも大丈夫ですか？
    a: 大丈夫です。動画のオンライン研修と、グループの先輩スタッフに同行する研修（5日間・約12〜16件）を受けてから独り立ちします。
  - q: 副業でも始められますか？
    a: 始められます。稼働する日と件数は自分で決められ、案件ごとに受けるかどうかも選べます。
  - q: 報酬はいつ支払われますか？
    a: 翌月15日〜20日に、銀行振込でお支払いします。
  - q: 道具を指定の店で買う必要はありますか？
    a: ありません。自分で選んで揃えていただきます。店は道具・車両の販売・リース・業者の紹介をしません。
  - q: 活動範囲はどのくらいですか？
    a: 松山市を中心に、車で約60分圏内です。担当範囲は面談で相談して決めます。

